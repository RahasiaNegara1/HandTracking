<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra-Smooth 3D Hand Tracking - MediaPipe & Three.js</title>
  
  <!-- MediaPipe Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  
  <!-- Three.js (Library Objek 3D) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 24px;
      text-align: center;
    }

    p.subtitle {
      color: #94a3b8;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 14px;
      text-align: center;
    }

    #display-container {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #000000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 2px solid #334155;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
      opacity: 0.5;
    }

    #hand_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      z-index: 2;
      pointer-events: none;
    }

    #three_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    #controls-panel {
      margin-top: 15px;
      background: #1e293b;
      padding: 15px 25px;
      border-radius: 10px;
      display: flex;
      gap: 20px;
      border: 1px solid #334155;
      flex-wrap: wrap;
      justify-content: center;
    }

    .control-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .control-btn:hover {
      background: #2563eb;
    }

    #status-panel {
      margin-top: 10px;
      display: flex;
      gap: 30px;
      font-size: 14px;
      color: #cbd5e1;
    }

    .highlight {
      color: #38bdf8;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <h1>Ultra-Smooth 3D Hand Tracking</h1>
  <p class="subtitle">
    <b>Pinch (Ibu jari + Telunjuk):</b> Memutar Objek | 
    <b>2 Tangan Terbuka:</b> Mengubah Ukuran | 
    <b>Buka Tangan:</b> Memindahkan Posisi
  </p>

  <div id="display-container">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="hand_canvas" width="1280" height="720"></canvas>
    <canvas id="three_canvas"></canvas>
  </div>

  <div id="controls-panel">
    <button class="control-btn" onclick="changeShape('cube')">Kubus</button>
    <button class="control-btn" onclick="changeShape('sphere')">Bola</button>
    <button class="control-btn" onclick="changeShape('torus')">Donat (Torus)</button>
    <button class="control-btn" onclick="resetObject()">Reset Posisi</button>
  </div>

  <div id="status-panel">
    <div>Aksi 3D: <span id="action-state" class="highlight">Diam</span></div>
    <div>Jumlah Tangan: <span id="hand-count" class="highlight">0</span></div>
  </div>

  <script>
    // --- 1. SETUP THREE.JS (SCENE 3D) ---
    const container = document.getElementById('display-container');
    const threeCanvas = document.getElementById('three_canvas');
    
    const scene = new THREE.Scene();
    const camera3D = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera3D.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);

    // Lightings
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0x38bdf8, 1.8);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);

    // Objek 3D & Target Variabel untuk LERPS Smoothing
    let currentMesh;
    const targetState = {
      posX: 0, posY: 0,
      rotX: 0, rotY: 0,
      scale: 1
    };

    const material = new THREE.MeshStandardMaterial({ 
      color: 0x3b82f6, 
      roughness: 0.2,
      metalness: 0.7 
    });

    function createMesh(geometryType) {
      if (currentMesh) scene.remove(currentMesh);
      let geometry;

      if (geometryType === 'cube') {
        geometry = new THREE.BoxGeometry(2, 2, 2);
      } else if (geometryType === 'sphere') {
        geometry = new THREE.SphereGeometry(1.4, 32, 32);
      } else if (geometryType === 'torus') {
        geometry = new THREE.TorusGeometry(1.1, 0.4, 16, 100);
      }

      currentMesh = new THREE.Mesh(geometry, material);
      scene.add(currentMesh);
    }

    createMesh('cube');

    function changeShape(type) {
      createMesh(type);
    }

    function resetObject() {
      targetState.posX = 0;
      targetState.posY = 0;
      targetState.rotX = 0;
      targetState.rotY = 0;
      targetState.scale = 1;
    }

    // Loop Animasi THREE.JS dengan Smoothing (Linear Interpolation)
    function animate3D() {
      requestAnimationFrame(animate3D);

      if (currentMesh) {
        // Faktor LERP (Semakin kecil semakin smooth & lambat, 0.1 adalah angka paling ideal)
        const lerpFactor = 0.1;

        currentMesh.position.x += (targetState.posX - currentMesh.position.x) * lerpFactor;
        currentMesh.position.y += (targetState.posY - currentMesh.position.y) * lerpFactor;
        
        currentMesh.rotation.x += (targetState.rotX - currentMesh.rotation.x) * lerpFactor;
        currentMesh.rotation.y += (targetState.rotY - currentMesh.rotation.y) * lerpFactor;

        const currentScale = currentMesh.scale.x;
        const newScale = currentScale + (targetState.scale - currentScale) * lerpFactor;
        currentMesh.scale.set(newScale, newScale, newScale);
      }

      renderer.render(scene, camera3D);
    }
    animate3D();


    // --- 2. MEDIAPIPE TRACKING & FILTER NOISE ---
    const videoElement = document.getElementById('webcam');
    const handCanvas = document.getElementById('hand_canvas');
    const canvasCtx = handCanvas.getContext('2d');
    const actionStateEl = document.getElementById('action-state');
    const handCountEl = document.getElementById('hand-count');

    // Filter Exponential Moving Average (Penyaring Getaran Tangan)
    const smoothLandmarks = {};

    function applyLowPassFilter(handIndex, landmarks) {
      if (!smoothLandmarks[handIndex]) {
        smoothLandmarks[handIndex] = landmarks.map(p => ({ ...p }));
        return smoothLandmarks[handIndex];
      }

      const alpha = 0.35; // Bobot kehalusan data (0.35 menyaring noise getaran tanpa lag)
      for (let i = 0; i < landmarks.length; i++) {
        smoothLandmarks[handIndex][i].x += (landmarks[i].x - smoothLandmarks[handIndex][i].x) * alpha;
        smoothLandmarks[handIndex][i].y += (landmarks[i].y - smoothLandmarks[handIndex][i].y) * alpha;
        smoothLandmarks[handIndex][i].z += (landmarks[i].z - smoothLandmarks[handIndex][i].z) * alpha;
      }

      return smoothLandmarks[handIndex];
    }

    function calculateDistance(p1, p2) {
      return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2) + Math.pow(p1.z - p2.z, 2));
    }

    let prevIndexPos = null;

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        handCountEl.innerText = results.multiHandLandmarks.length;

        // Terapkan Smoothing Filter pada Setiap Tangan
        const filteredHands = results.multiHandLandmarks.map((lm, index) => applyLowPassFilter(index, lm));

        // Render Rangka Tangan
        for (const landmarks of filteredHands) {
          drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#00FFC8', lineWidth: 3 });
          drawLandmarks(canvasCtx, landmarks, { color: '#FF0055', lineWidth: 1, radius: 4 });
        }

        const hand1 = filteredHands[0];
        const thumbTip = hand1[4];
        const indexTip = hand1[8];

        const pinchDist = calculateDistance(thumbTip, indexTip);

        // FITUR 1: ROTASI OBJEK 3D (Pinch / Jepit Ibu Jari & Telunjuk)
        if (pinchDist < 0.08) {
          actionStateEl.innerText = "Memutar Objek (Rotate)";

          if (prevIndexPos) {
            const deltaX = (indexTip.x - prevIndexPos.x) * 4;
            const deltaY = (indexTip.y - prevIndexPos.y) * 4;

            targetState.rotY += deltaX;
            targetState.rotX += deltaY;
          }
          prevIndexPos = { x: indexTip.x, y: indexTip.y };
        } 
        // FITUR 2: SKALA / PERBESAR (Menggunakan 2 Tangan)
        else if (filteredHands.length === 2) {
          actionStateEl.innerText = "Mengubah Ukuran (Scale)";
          const hand2 = filteredHands[1];

          const wrist1 = hand1[0];
          const wrist2 = hand2[0];
          const handsDistance = calculateDistance(wrist1, wrist2);

          targetState.scale = Math.max(0.4, Math.min(2.8, handsDistance * 3.5));
          prevIndexPos = null;
        } 
        // FITUR 3: GESER POSISI OBJEK (Telapak Tangan Terbuka)
        else {
          actionStateEl.innerText = "Menggeser Posisi (Translate)";

          // Konversi Posisi Jari Telunjuk ke Target 3D World
          targetState.posX = (0.5 - indexTip.x) * 6; // Mirroring Hand Position
          targetState.posY = (0.5 - indexTip.y) * 4;

          prevIndexPos = null;
        }

      } else {
        handCountEl.innerText = "0";
        actionStateEl.innerText = "Tidak Ada Tangan";
        prevIndexPos = null;
        delete smoothLandmarks[0];
        delete smoothLandmarks[1];
      }

      canvasCtx.restore();
    }

    // Inisialisasi MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 1280,
      height: 720
    });

    camera.start();

    // Auto-Resize Responsif
    window.addEventListener('resize', () => {
      camera3D.aspect = container.clientWidth / container.clientHeight;
      camera3D.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
