<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand Tracking AI - Fully Fixed</title>
  
  <!-- MediaPipe Official Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 24px;
      text-align: center;
    }

    p.subtitle {
      color: #94a3b8;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 14px;
      text-align: center;
    }

    #error-box {
      display: none;
      background-color: #ef4444;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 8px;
      margin-bottom: 15px;
      max-width: 960px;
      width: 100%;
      text-align: center;
      font-weight: 500;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    #canvas-container {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    video {
      display: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* Mirror view agar gerakan tangan alami */
    }

    /* Target Interaktif Virtual */
    #interactive-box {
      position: absolute;
      top: 40px;
      left: 40px;
      width: 110px;
      height: 110px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
      user-select: none;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
      transition: background 0.2s, transform 0.1s;
      z-index: 10;
    }

    /* Kursor Virtual */
    #virtual-cursor {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: #ef4444;
      border: 2px solid #ffffff;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 100;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
      transition: background-color 0.15s, transform 0.15s;
    }

    #status-panel {
      margin-top: 20px;
      background: #1e293b;
      padding: 15px 30px;
      border-radius: 10px;
      display: flex;
      gap: 40px;
      border: 1px solid #334155;
    }

    .status-item {
      font-size: 15px;
      color: #cbd5e1;
    }

    .highlight {
      color: #38bdf8;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <h1>Hand Tracking & Virtual Interaction</h1>
  <p class="subtitle">Arahkan jari telunjuk untuk menggerakkan kursor. Lakukan <b>Pinch</b> (jepit ibu jari & telunjuk) untuk menggeser kotak.</p>

  <div id="error-box"></div>

  <div id="canvas-container">
    <video id="webcam" playsinline></video>
    <canvas id="output_canvas" width="1280" height="720"></canvas>
    
    <!-- Element Interaktif -->
    <div id="interactive-box">Geser Saya</div>
    <div id="virtual-cursor"></div>
  </div>

  <div id="status-panel">
    <div class="status-item">Jumlah Tangan: <span id="hand-count" class="highlight">0</span></div>
    <div class="status-item">Gesture: <span id="gesture-detected" class="highlight">Tidak Ada</span></div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const cursor = document.getElementById('virtual-cursor');
    const handCountEl = document.getElementById('hand-count');
    const gestureEl = document.getElementById('gesture-detected');
    const errorBox = document.getElementById('error-box');
    const box = document.getElementById('interactive-box');

    function showError(msg) {
      errorBox.style.display = 'block';
      errorBox.innerHTML = msg;
    }

    // Menghitung Jarak Euclidean 3D
    function calculateDistance(p1, p2) {
      return Math.sqrt(
        Math.pow(p1.x - p2.x, 2) +
        Math.pow(p1.y - p2.y, 2) +
        Math.pow(p1.z - p2.z, 2)
      );
    }

    // Deteksi Gesture Tangan
    function detectGesture(landmarks) {
      const thumbTip = landmarks[4];
      const indexTip = landmarks[8];
      const middleTip = landmarks[12];
      const ringTip = landmarks[16];
      const pinkyTip = landmarks[20];
      const wrist = landmarks[0];

      // Pinch: Ujung ibu jari dan telunjuk saling berdekatan
      const pinchDistance = calculateDistance(thumbTip, indexTip);
      if (pinchDistance < 0.06) {
        return 'Pinch (Klik / Hold)';
      }

      // Mengepal: Semua ujung jari dekat dengan pergelangan tangan
      const isFist = [indexTip, middleTip, ringTip, pinkyTip].every(
        tip => calculateDistance(tip, wrist) < 0.28
      );
      if (isFist) {
        return 'Mengepal';
      }

      return 'Terbuka';
    }

    let isDragging = false;

    // Callback pemrosesan frame MediaPipe
    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      
      // Gambar feed kamera ke canvas
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        handCountEl.innerText = results.multiHandLandmarks.length;

        for (let i = 0; i < results.multiHandLandmarks.length; i++) {
          const landmarks = results.multiHandLandmarks[i];

          // 1. Gambar 21 Titik & Rangka Tangan
          drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#38bdf8', lineWidth: 3 });
          drawLandmarks(canvasCtx, landmarks, { color: '#ef4444', lineWidth: 1, radius: 4 });

          // 2. Kontrol Interaksi pada Tangan Pertama
          if (i === 0) {
            const currentGesture = detectGesture(landmarks);
            gestureEl.innerText = currentGesture;

            const indexTip = landmarks[8];
            const containerRect = canvasElement.getBoundingClientRect();
            
            // Konversi Posisi Kursor (Dibalik karena efek Mirroring)
            const cursorX = (1 - indexTip.x) * containerRect.width;
            const cursorY = indexTip.y * containerRect.height;

            cursor.style.display = 'block';
            cursor.style.left = `${cursorX}px`;
            cursor.style.top = `${cursorY}px`;

            const boxRect = box.getBoundingClientRect();
            const relCursorX = containerRect.left + cursorX;
            const relCursorY = containerRect.top + cursorY;

            // 3. Logika Drag and Drop
            if (currentGesture === 'Pinch (Klik / Hold)') {
              cursor.style.backgroundColor = '#4ade80';
              cursor.style.transform = 'translate(-50%, -50%) scale(1.3)';

              if (!isDragging) {
                if (
                  relCursorX >= boxRect.left &&
                  relCursorX <= boxRect.right &&
                  relCursorY >= boxRect.top &&
                  relCursorY <= boxRect.bottom
                ) {
                  isDragging = true;
                }
              }

              if (isDragging) {
                box.style.left = `${cursorX - 55}px`;
                box.style.top = `${cursorY - 55}px`;
                box.style.background = 'linear-gradient(135deg, #22c55e, #15803d)';
              }
            } else {
              cursor.style.backgroundColor = '#ef4444';
              cursor.style.transform = 'translate(-50%, -50%) scale(1)';
              isDragging = false;
              box.style.background = 'linear-gradient(135deg, #3b82f6, #1d4ed8)';
            }
          }
        }
      } else {
        handCountEl.innerText = '0';
        gestureEl.innerText = 'Tidak Ada';
        cursor.style.display = 'none';
        isDragging = false;
      }

      canvasCtx.restore();
    }

    // Inisialisasi MediaPipe Hands
    try {
      const hands = new Hands({
        locateFile: (file) => {
          // Mengunduh aset .wasm langsung dari CDN MediaPipe
          return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      hands.onResults(onResults);

      const camera = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 1280,
        height: 720
      });

      camera.start().catch(err => {
        showError(`<b>Akses Kamera Ditolak / Gagal:</b> ${err.message}. Pastikan izin kamera aktif dan Anda mengakses via <b>HTTPS</b> atau <b>localhost</b>.`);
      });

    } catch (err) {
      showError(`<b>Gagal Memuat Pustaka AI:</b> ${err.message}. Periksa koneksi internet atau matikan sementara Ad-Blocker.`);
    }
  </script>
</body>
</html>
